<?xml version="1.0" encoding="UTF-8"?>
<!--
  THE GO BIG AGENCY — Horizontal Lockup V6 (final, black ground)

  Canvas: 1800 × 540
  Monogram:  scaled to ~400 tall on the left
  Wordmark:  "GO BIG" Switzer Black, balanced with monogram
  Tagline:   AGENCY tracked, gold accent
  Separator: thin gold vertical hairline between monogram and wordmark
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 540" width="1800" height="540">
  <rect width="1800" height="540" fill="#000000"/>

  <!-- GB monogram, scaled and positioned on the left.
       Original letters: x=25..1055 in 1080 viewBox, y=190..890 (700 tall)
       Target: letters span ~400 tall, positioned at top-left with margin -->
  <g transform="translate(60 70) scale(0.5)">
    <g transform="translate(-25 -190)">
      <path fill="#FFFFFF" d="
        M 95 190
        L 495 190
        A 70 70 0 0 1 565 260
        L 565 320
        L 155 320
        L 155 760
        L 435 760
        L 435 590
        L 295 590
        L 295 510
        L 565 510
        L 565 820
        A 70 70 0 0 1 495 890
        L 95 890
        A 70 70 0 0 1 25 820
        L 25 260
        A 70 70 0 0 1 95 190
        Z
      "/>
      <path fill="#FFFFFF" fill-rule="evenodd" d="
        M 665 190
        L 985 190
        A 70 70 0 0 1 1055 260
        L 1055 820
        A 70 70 0 0 1 985 890
        L 665 890
        A 70 70 0 0 1 595 820
        L 595 260
        A 70 70 0 0 1 665 190
        Z
        M 725 320 L 725 510 L 925 510 L 925 320 Z
        M 725 590 L 725 760 L 925 760 L 925 590 Z
      "/>
    </g>
  </g>
  <!-- monogram bounding x: 60..(60+1030*0.5)=575, y: 70..(70+700*0.5)=420 -->

  <!-- Vertical separator: thin gold hairline between monogram and wordmark -->
  <line x1="640" y1="100" x2="640" y2="440" stroke="#C8952E" stroke-width="3"/>

  <!-- Wordmark: GO BIG. Switzer Black. Sized to match monogram visual height. -->
  <g transform="translate(710 0) scale(1.10 1)">
    <text x="0" y="370"
          font-family="'Switzer Variable','Switzer','Inter',sans-serif"
          font-weight="900"
          font-size="280"
          letter-spacing="-0.045em"
          fill="#FFFFFF"
          dominant-baseline="alphabetic">GO BIG</text>
  </g>

  <!-- Supporting tagline "AGENCY" tracked in gold -->
  <text x="710" y="445"
        font-family="'Inter','Helvetica Neue',sans-serif"
        font-weight="600"
        font-size="22"
        letter-spacing="0.5em"
        fill="#C8952E"
        text-transform="uppercase">AGENCY</text>
</svg>
