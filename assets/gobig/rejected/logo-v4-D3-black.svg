<?xml version="1.0" encoding="UTF-8"?>
<!--
  V4 / Direction 3 — GB with subtle letter-cut modification, black ground
  Switzer Black 900. Tesla stretch 1.18x.
  Custom move: a 60x60 diagonal notch on the bottom-right corner of the B,
  achieved via a black triangular overlay drawn ON TOP of the white text.
  Reads as engineered / machined / not from a default font.
  Off-White structural tension reference: visible specification.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <rect width="1080" height="1080" fill="#000000"/>

  <g transform="translate(540 0) scale(1.18 1) translate(-540 0)">
    <text x="540" y="555"
          font-family="'Switzer Variable','Switzer','Inter',sans-serif"
          font-weight="900"
          font-size="560"
          letter-spacing="-0.045em"
          fill="#FFFFFF"
          text-anchor="middle"
          dominant-baseline="middle">GB</text>
  </g>

  <!-- Diagonal chamfer INTO the B's bottom-right corner.
       Triangle filled with ground color (black) subtracts a corner of the letter.
       Result: B has a 70-px diagonal cut at its bottom-right edge. -->
  <polygon points="885,660 885,725 815,725" fill="#000000"/>

  <!-- Gold hairline along the cut edge — deliberate machine-finish.
       Reads as a chamfer marker, not decoration. -->
  <line x1="885" y1="660" x2="815" y2="725" stroke="#C8952E" stroke-width="6" stroke-linecap="square"/>
</svg>
