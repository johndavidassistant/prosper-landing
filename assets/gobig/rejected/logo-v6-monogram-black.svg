<!--
  THE GO BIG AGENCY — Monogram V6 (final, black ground)

  Design system:
    Cap height H        = 700
    Stem width  S        = 130   (~18.5% of H, modern heavy grotesk)
    Outer corner R       = 70    (refined)
    Letter widths        G=540, B=460
    Inter-letter spacing = 30 (optical, tight)
    Counter holes        sharp 90° (engineered grotesk)

  The G has a proper grotesk anatomy: middle bar + right return spur connect
  at the bottom-right hook. The B has two stacked counters at matched heights.
  Both letters share corner radius and stem width — one system.
  No chamfer, no decoration. Pure typography.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <rect width="1080" height="1080" fill="#000000"/>

  <!-- G -->
  <path fill="#FFFFFF" d="
    M 95 190
    L 495 190
    A 70 70 0 0 1 565 260
    L 565 320
    L 155 320
    L 155 760
    L 435 760
    L 435 590
    L 295 590
    L 295 510
    L 565 510
    L 565 820
    A 70 70 0 0 1 495 890
    L 95 890
    A 70 70 0 0 1 25 820
    L 25 260
    A 70 70 0 0 1 95 190
    Z
  "/>

  <!-- B -->
  <path fill="#FFFFFF" fill-rule="evenodd" d="
    M 665 190
    L 985 190
    A 70 70 0 0 1 1055 260
    L 1055 820
    A 70 70 0 0 1 985 890
    L 665 890
    A 70 70 0 0 1 595 820
    L 595 260
    A 70 70 0 0 1 665 190
    Z
    M 725 320 L 725 510 L 925 510 L 925 320 Z
    M 725 590 L 725 760 L 925 760 L 925 590 Z
  "/>
</svg>
