<?xml version="1.0" encoding="UTF-8"?>
<!--
  V4 / Direction 1 — Pure GB, no frame, black ground
  Switzer Black 900. Tesla horizontal stretch 1.18x. Kerning -0.045em.
  Letters do all the work.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080">
  <rect width="1080" height="1080" fill="#000000"/>
  <g transform="translate(540 0) scale(1.18 1) translate(-540 0)">
    <text x="540" y="555"
          font-family="'Switzer Variable','Switzer','Inter',sans-serif"
          font-weight="900"
          font-size="560"
          letter-spacing="-0.045em"
          fill="#FFFFFF"
          text-anchor="middle"
          dominant-baseline="middle">GB</text>
  </g>
</svg>
